name: Build and Deploy Angular App to GitHub Pages

on:
  push:
    branches: ["working_branch"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./luxe-inventory
        run: npm install

      - name: Build Angular App
        working-directory: ./luxe-inventory
        run: npx ng build --configuration production

      - name: Upload build output to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: luxe-inventory/dist/luxe-inventory/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
